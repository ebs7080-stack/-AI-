# 오류 case 목록. id 는 Finding.case_id, 단계별 힌트, 교사 통계(FR-3)를 잇는 키다.
# 문법 오류(method = "syntax", 분류 규칙은 syntax.py)가 먼저 나오고, 그 뒤에 논리 오류(method = "ast",
# 규칙은 rules/)가 있다. 설계는 docs/static-analysis.md 1·3단계.
#
# 힌트를 쓸 때 지킬 것:
# - 단계 수는 case 마다 달라도 된다 (2단계 이상). 순서는 관찰 → 의심 지점 → 힌트 → 추가 힌트이고,
#   필요 없는 단계는 빼도 되지만 '의심 지점'과 '힌트'는 꼭 둔다.
# - 줄 번호({line})는 '의심 지점'에서 처음 나온다. '관찰'에는 쓰지 않는다.
# - 문법 오류라 실행되지 않았다는 말은 화면이 힌트 위에 따로 안내하므로 단계마다 되풀이하지 않는다.
#   '관찰'에는 파이썬이 그 자리에서 무엇을 기대했고 왜 멈췄는지를 그 case 에 맞게 쓴다.
# - 고친 코드(정답)는 어느 단계에도 쓰지 않는다 (FR-1.4). 빠진 기호나 단어를 직접 말하지 않고,
#   무엇을 떠올리거나 견줘 보면 되는지를 알려 준다.
# - 문법 오류에서 채울 수 있는 값: {line} 오류가 난 줄, {keyword} 그 줄의 첫 단어, {opener} 블록을 연
#   문장의 종류, {opener_line} 그 문장의 줄, {char} 문제가 된 글자. (논리 오류의 값은 그 묶음 위에 있다.)

# ---------- 조건문 ----------

[[case]]
id = "cond.missing_colon"
category = "조건문"
label = "조건문 뒤에 콜론을 빠뜨리기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 `{keyword}`로 시작하는 줄을 읽다가 멈췄어요. 그 줄이 어디에서 끝나고 본문이 어디에서 시작하는지 알려 주는 표시를 찾지 못했어요." },
  { label = "의심 지점", text = "{line}번 줄의 맨 끝을 보세요. 기호 하나가 빠져 있어요." },
  { label = "힌트", text = "`if`, `elif`, `else`로 시작하는 줄은 언제나 같은 기호로 끝나요. 전에 쓴 조건문이나 교과서 예시의 줄 끝과 견줘 보세요." },
]

[[case]]
id = "cond.else_if"
category = "조건문"
label = "else if 라고 쓰기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 `else` 바로 뒤에 온 단어를 이해하지 못하고 멈췄어요. `else` 뒤에는 조건을 쓸 수 없어요." },
  { label = "의심 지점", text = "{line}번 줄을 시작하는 두 단어를 보세요." },
  { label = "힌트", text = "'그렇지 않고, 만약 ~라면'을 뜻하는 단어가 파이썬에는 따로 하나 있어요. `else`와 `if`를 나란히 쓰는 대신 그 한 단어를 써야 해요." },
]

[[case]]
id = "cond.assign_in_if"
category = "조건문"
label = "= 와 == 를 혼동하기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 조건을 읽다가 멈췄어요. 조건 자리에는 참인지 거짓인지 물어보는 식이 와야 하는데, 값을 넣으라는 뜻의 기호가 들어 있어요." },
  { label = "의심 지점", text = "{line}번 줄 `{keyword}` 뒤의 조건에 쓴 `=` 기호를 보세요." },
  { label = "힌트", text = "`=` 하나는 '오른쪽 값을 왼쪽 변수에 넣어라'는 뜻이에요. '두 값이 서로 같은가?'를 물을 때 쓰는 기호는 따로 있어요." },
]

[[case]]
id = "cond.body_not_indented"
category = "조건문"
label = "조건문 본문을 들여쓰기 하지 않기"
method = "syntax"
steps = [
  { label = "관찰", text = "`{opener}` 줄 다음에는 `{opener}`에 딸린 문장이 와야 하는데, 파이썬이 그런 문장을 찾지 못했어요." },
  { label = "의심 지점", text = "{opener_line}번 줄 `{opener}` 바로 아래에 있는 {line}번 줄을 보세요. `{opener}`보다 안쪽에서 시작하지 않아요." },
  { label = "힌트", text = "파이썬은 줄 앞의 빈칸(들여쓰기)을 보고 어떤 문장이 `{opener}`에 딸려 있는지 알아내요. `{opener}`에 딸린 문장은 `{opener}`보다 안쪽에서 시작해야 해요." },
]

[[case]]
id = "cond.else_misaligned"
category = "조건문"
label = "if 와 else 의 들여쓰기 위치를 맞추지 않기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 `{keyword}`가 어느 `if`와 짝인지 찾지 못하고 멈췄어요." },
  { label = "의심 지점", text = "{line}번 줄 `{keyword}` 앞의 빈칸 수와, 짝이 되는 `if` 앞의 빈칸 수를 각각 세어 보세요." },
  { label = "힌트", text = "`{keyword}`는 짝이 되는 `if`와 정확히 같은 위치에서 시작해야 해요. 한 칸만 달라도 파이썬은 짝으로 보지 않아요." },
]

# ---------- 반복문 ----------

[[case]]
id = "loop.missing_colon"
category = "반복문"
label = "for 문이나 while 문 뒤에 콜론을 빠뜨리기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 `{keyword}`로 시작하는 줄을 읽다가 멈췄어요. 어디까지가 반복 조건이고 어디서부터가 반복할 문장인지 알려 주는 표시를 찾지 못했어요." },
  { label = "의심 지점", text = "{line}번 줄의 맨 끝을 보세요. 기호 하나가 빠져 있어요." },
  { label = "힌트", text = "`for`, `while`로 시작하는 줄은 언제나 같은 기호로 끝나요. `if` 줄의 끝에 쓰는 기호와 같아요." },
]

[[case]]
id = "loop.body_not_indented"
category = "반복문"
label = "반복할 문장이 반복문 안에 들어가지 않게 들여쓰기 하기"
method = "syntax"
steps = [
  { label = "관찰", text = "`{opener}` 줄 다음에는 반복할 문장이 와야 하는데, 파이썬이 그런 문장을 찾지 못했어요." },
  { label = "의심 지점", text = "{opener_line}번 줄 `{opener}` 바로 아래에 있는 {line}번 줄을 보세요. `{opener}`보다 안쪽에서 시작하지 않아요." },
  { label = "힌트", text = "파이썬은 줄 앞의 빈칸(들여쓰기)을 보고 어떤 문장을 반복할지 알아내요. 반복할 문장은 `{opener}`보다 안쪽에서 시작해야 해요." },
]

[[case]]
id = "nested.inner_same_indent"
category = "중첩 반복문"
label = "안쪽 반복문을 바깥쪽과 같은 들여쓰기에 쓰기"
method = "syntax"
steps = [
  { label = "관찰", text = "반복문 줄 다음에는 그 안에서 반복할 문장이 와야 하는데, 파이썬이 그런 문장을 찾지 못했어요." },
  { label = "의심 지점", text = "{opener_line}번 줄과 {line}번 줄에 반복문이 하나씩 있어요. 두 줄이 시작하는 위치를 견줘 보세요." },
  { label = "힌트", text = "두 반복문이 같은 위치에서 시작하면 파이썬은 '안과 밖'이 아니라 서로 상관없는 '위와 아래'로 읽어요. 안쪽 반복문은 바깥쪽 반복문보다 안쪽에서 시작해야 해요." },
  { label = "추가 힌트", text = "안쪽 반복문을 옮길 때는 그 반복문에 딸린 문장들도 함께 같은 만큼 더 안쪽으로 옮겨야 해요." },
]

# ---------- 함수 ----------

[[case]]
id = "func.missing_colon"
category = "함수"
label = "함수 정의 뒤에 콜론을 빠뜨리기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 `def`로 시작하는 줄을 읽다가 멈췄어요. 함수 이름과 매개변수 다음에, 여기서부터 본문이라고 알려 주는 표시를 찾지 못했어요." },
  { label = "의심 지점", text = "{line}번 줄의 맨 끝을 보세요. 기호 하나가 빠져 있어요." },
  { label = "힌트", text = "`def`로 시작하는 줄도 `if`나 `for` 줄과 같은 기호로 끝나요." },
]

[[case]]
id = "func.def_missing_paren"
category = "함수"
label = "함수 정의에서 괄호를 빠뜨리기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 함수를 만드는 줄을 읽다가 멈췄어요. 함수 이름 다음에 꼭 와야 하는 것이 빠져 있어요." },
  { label = "의심 지점", text = "{line}번 줄에서 함수 이름 바로 뒤를 보세요." },
  { label = "힌트", text = "함수 이름 뒤에는 받을 값(매개변수)을 적는 자리가 꼭 있어야 해요. 받을 값이 하나도 없어도 그 자리는 비워 둔 채로 써 줘야 해요." },
]

[[case]]
id = "func.body_not_indented"
category = "함수"
label = "함수 본문을 들여쓰기 하지 않기"
method = "syntax"
steps = [
  { label = "관찰", text = "`def` 줄 다음에는 함수가 할 일이 와야 하는데, 파이썬이 그런 문장을 찾지 못했어요." },
  { label = "의심 지점", text = "{opener_line}번 줄 `def` 바로 아래에 있는 {line}번 줄을 보세요. `def`보다 안쪽에서 시작하지 않아요." },
  { label = "힌트", text = "파이썬은 줄 앞의 빈칸(들여쓰기)을 보고 어디까지가 함수 안인지 알아내요. 함수가 할 일은 `def`보다 안쪽에서 시작해야 해요." },
]

# ---------- 변수 ----------

[[case]]
id = "var.name_starts_with_digit"
category = "변수"
label = "변수 이름 규칙을 어기기 (숫자로 시작)"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 변수 이름을 읽다가 멈췄어요. 이름이 아니라 숫자가 시작되는 줄 알았는데 뒤에 글자가 이어졌기 때문이에요." },
  { label = "의심 지점", text = "{line}번 줄에서 `=` 왼쪽에 쓴 이름의 첫 글자를 보세요." },
  { label = "힌트", text = "변수 이름은 숫자로 시작할 수 없어요. 숫자는 이름의 중간이나 끝에만 쓸 수 있어요." },
]

[[case]]
id = "var.name_with_space"
category = "변수"
label = "변수 이름 규칙을 어기기 (빈칸 포함)"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 변수 이름을 읽다가 멈췄어요. 이름 하나가 올 자리에 단어가 여러 개 있어요." },
  { label = "의심 지점", text = "{line}번 줄에서 `=` 왼쪽을 보세요. 단어 사이에 빈칸이 있어요." },
  { label = "힌트", text = "변수 이름에는 빈칸을 넣을 수 없어요. 파이썬은 빈칸으로 나뉜 단어를 서로 다른 이름으로 읽어요." },
  { label = "추가 힌트", text = "여러 단어를 이름 하나로 쓰고 싶을 때 빈칸 대신 넣는 기호가 있어요. 교과서나 다른 코드에서 여러 단어로 된 변수 이름을 어떻게 썼는지 떠올려 보세요." },
]

# ---------- 그 밖의 문법 오류 (오류case.txt 에는 없지만 초보자에게 흔하다) ----------

[[case]]
id = "syntax.unclosed_bracket"
category = "문법"
label = "괄호를 닫지 않기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 코드를 끝까지 읽었는데도 열어 둔 괄호의 짝을 찾지 못했어요." },
  { label = "의심 지점", text = "{line}번 줄에서 `{char}`로 연 괄호를 보세요." },
  { label = "힌트", text = "여는 괄호와 닫는 괄호는 개수가 같아야 해요. 그 줄의 괄호를 안쪽부터 하나씩 짝지어 보세요." },
]

[[case]]
id = "syntax.unclosed_string"
category = "문법"
label = "따옴표를 닫지 않기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 문자열이 어디에서 끝나는지 찾지 못했어요. 따옴표로 시작한 글이 끝나지 않았어요." },
  { label = "의심 지점", text = "{line}번 줄에서 따옴표로 시작한 부분을 보세요." },
  { label = "힌트", text = "문자열은 시작할 때 쓴 것과 같은 종류의 따옴표로 끝나야 해요. 작은따옴표로 시작했는지 큰따옴표로 시작했는지 보고, 끝에도 같은 것이 있는지 확인해 보세요." },
]

[[case]]
id = "syntax.fullwidth_char"
category = "문법"
label = "파이썬이 읽지 못하는 글자 쓰기 (전각 기호 등)"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 알아보지 못하는 글자를 만나서 멈췄어요." },
  { label = "의심 지점", text = "{line}번 줄에 있는 `{char}` 글자를 보세요. 평소에 쓰던 기호와 모양이 조금 달라요." },
  { label = "힌트", text = "한글 입력 상태에서 친 괄호·따옴표나 문서에서 복사해 온 기호는 눈으로는 비슷해도 파이썬에게는 다른 글자예요. 그 글자를 지우고 영문 입력 상태에서 다시 쳐 보세요." },
]

[[case]]
id = "syntax.unexpected_indent"
category = "문법"
label = "필요 없는 곳에 들여쓰기 하기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 들여쓰기가 필요 없는 자리에서 들여쓴 줄을 만나서 멈췄어요." },
  { label = "의심 지점", text = "{line}번 줄이 바로 윗줄보다 안쪽에서 시작해요. 그런데 윗줄은 `if`, `for`, `def`처럼 딸린 문장을 거느리는 줄이 아니에요." },
  { label = "힌트", text = "들여쓰기는 어떤 줄에 딸린 문장에만 써요. 이 줄이 딸려 있는 줄이 없다면 윗줄과 같은 위치에서 시작해야 해요." },
]

[[case]]
id = "syntax.indent_mismatch"
category = "문법"
label = "들여쓰기 위치를 앞의 줄과 맞추지 않기"
method = "syntax"
steps = [
  { label = "관찰", text = "파이썬이 들여쓰기를 줄인 줄을 읽다가 멈췄어요. 그 줄이 시작하는 위치가 위쪽의 어떤 줄과도 맞지 않아요." },
  { label = "의심 지점", text = "{line}번 줄 앞의 빈칸 수를 세어 보고, 위쪽 줄들의 빈칸 수와 견줘 보세요." },
  { label = "힌트", text = "같은 묶음에 속한 문장은 모두 똑같은 위치에서 시작해야 해요. 들여쓰기를 줄일 때는 위쪽에 있는 어느 한 줄과 정확히 같은 위치로 돌아가야 해요." },
]

[[case]]
id = "syntax.unknown"
category = "문법"
label = "그 밖의 문법 오류"
method = "syntax"
steps = [
  { label = "의심 지점", text = "파이썬이 {line}번 줄 근처에서 읽기를 멈췄어요. 원인이 바로 윗줄에 있을 때도 있으니 두 줄을 함께 보세요." },
  { label = "힌트", text = "괄호와 따옴표의 짝, 줄 끝의 기호, 줄이 시작하는 위치, 낱말의 철자를 하나씩 확인해 보세요." },
]

# ==================== 논리 오류 (method = "ast") ====================
# 문법은 통과했지만 실행하면 멈추거나 결과가 틀릴 것으로 보이는 곳이다. 규칙은 app/analyzer/rules/.
# 확정이 아니라 '의심 지점'이므로 단정하지 않고 학생이 직접 따져 보게 묻는다.
# - '관찰'에는 실행하면 무슨 일이 생기는지(멈춤, 끝나지 않음, 결과가 이상함)를 쓴다. 줄 번호는 쓰지 않는다.
# - priority 가 작을수록 먼저 보여 준다: 20 실행하면 멈춤 → 30 끝나지 않음 → 40 결과가 틀림.
#   한 번에 하나만 보여 주고, 고쳐서 다시 내면 다음 것이 나온다.
# - 채울 수 있는 값: {line} 의심 줄, {other_line} 함께 볼 다른 줄, {name}·{name2} 학생이 쓴 이름,
#   {expr} 학생이 쓴 식, {count} 실제로 쓴 개수, {expected} 필요한 개수.

# ---------- 변수 ----------

[[case]]
id = "var.builtin_shadowed"
category = "변수"
label = "sum, max, list, str 같은 내장 함수 이름을 변수 이름으로 쓰기"
method = "ast"
priority = 20
steps = [
  { label = "관찰", text = "이 코드를 실행하면 `{name}(...)`을 부르는 줄에서 멈출 거예요. 파이썬이 원래 가지고 있던 `{name}` 함수가 더 이상 함수가 아니게 됐어요." },
  { label = "의심 지점", text = "{line}번 줄에서 `{name}`이라는 이름에 값을 넣었어요. 그 아래 {other_line}번 줄에서 같은 이름을 함수처럼 부르고 있어요." },
  { label = "힌트", text = "`{name}`은 파이썬이 미리 만들어 둔 함수의 이름이에요. 내가 만든 변수와 그 함수가 같은 이름을 나눠 쓸 수 있을까요? 변수 이름을 무엇으로 하면 좋을지 생각해 보세요." },
]

[[case]]
id = "var.str_plus_number"
category = "변수"
label = "문자열과 숫자를 + 로 이어 붙이기"
method = "ast"
priority = 20
steps = [
  { label = "관찰", text = "이 코드를 실행하면 글자와 숫자를 더하는 곳에서 멈출 거예요. 파이썬은 글자와 숫자를 바로 더하지 못해요." },
  { label = "의심 지점", text = "{line}번 줄의 `{expr}`을 보세요. `+` 양쪽에 있는 것이 각각 글자인지 숫자인지 따져 보세요." },
  { label = "힌트", text = "글자끼리는 이어 붙일 수 있고, 숫자끼리는 더할 수 있어요. 숫자를 글자 사이에 넣어 보여 주고 싶다면, 숫자를 무엇으로 바꿔야 할까요? `print`에 여러 값을 나눠 넘기는 방법도 떠올려 보세요." },
]

[[case]]
id = "var.input_not_converted"
category = "변수"
label = "input()으로 받은 값을 숫자로 바꾸지 않고 계산하기"
method = "ast"
priority = 20
steps = [
  { label = "관찰", text = "이 코드를 실행하면 계산하는 곳에서 멈추거나, 생각과 다른 결과(예: `33`)가 나올 거예요." },
  { label = "의심 지점", text = "{line}번 줄에서 `{name}`을 숫자와 함께 계산하고 있어요. `{name}`에는 어떤 종류의 값이 들어 있을까요?" },
  { label = "힌트", text = "`input()`은 키보드로 받은 것을 언제나 글자(문자열)로 줘요. `3`을 입력해도 숫자 3이 아니라 글자 \"3\"이에요. 숫자로 계산하려면 받은 값을 어떻게 해야 할까요?" },
]

[[case]]
id = "var.result_not_stored"
category = "변수"
label = "계산만 하고 결과를 변수에 저장하지 않기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "계산은 하지만 그 결과가 어디에도 남지 않아서, 실행해도 변수의 값이 바뀌지 않아요." },
  { label = "의심 지점", text = "{line}번 줄의 `{expr}`을 보세요. 이 줄이 실행된 뒤 계산한 값은 어디에 있을까요?" },
  { label = "힌트", text = "파이썬은 계산한 값을 따로 담으라고 하지 않으면 바로 버려요. 계산한 값을 변수에 담으려면 어떻게 써야 했는지 떠올려 보세요." },
]

[[case]]
id = "var.eq_as_assign"
category = "변수"
label = "값을 넣으려다 == 로 비교만 하기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "이 줄은 실행돼도 아무 변수의 값도 바꾸지 않아요. 두 값이 같은지 묻기만 하고 그 대답을 버려요." },
  { label = "의심 지점", text = "{line}번 줄의 `{expr}`을 보세요. 여기서 `{name}`에 값을 넣으려고 했나요, 아니면 같은지 물어보려고 했나요?" },
  { label = "힌트", text = "`==`는 '두 값이 같은가?'를 묻는 기호예요. 변수에 값을 넣을 때 쓰는 기호는 따로 있어요." },
]

[[case]]
id = "var.swap_without_temp"
category = "변수"
label = "두 변수의 값을 임시 변수 없이 서로 바꾸기 (a = b, b = a)"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "두 변수의 값을 바꾸려고 했지만, 실행하고 나면 두 변수에 같은 값이 들어 있을 거예요." },
  { label = "의심 지점", text = "{line}번 줄과 {other_line}번 줄을 차례로 따라가 보세요. {line}번 줄이 끝났을 때 `{name}`의 원래 값은 어디에 남아 있나요?" },
  { label = "힌트", text = "`{name}`에 새 값을 넣는 순간 원래 값은 사라져요. 사라지기 전에 원래 값을 잠깐 맡겨 둘 곳이 있다면 어떨까요? 파이썬에는 두 값을 한 줄에 함께 바꾸는 방법도 있어요." },
]

[[case]]
id = "var.quoted_variable"
category = "변수"
label = "변수 이름과 문자열을 혼동하기 (print(name) 대신 print(\"name\") 쓰기)"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "변수에 들어 있는 값 대신 변수의 이름 글자가 그대로 화면에 나올 거예요." },
  { label = "의심 지점", text = "{line}번 줄의 `print`에 넘긴 `\"{name}\"`을 보세요. 따옴표로 감싼 것과 `{name}` 변수는 같은 것일까요?" },
  { label = "힌트", text = "따옴표로 감싸면 파이썬은 그것을 글자 그대로로 봐요. 변수에 담긴 값을 꺼내 쓰려면 이름을 어떻게 써야 할까요?" },
]

# ---------- 조건문 ----------

[[case]]
id = "cond.input_str_compare"
category = "조건문"
label = "input()으로 받은 문자열과 숫자를 == 로 비교하기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "무엇을 입력해도 조건이 생각대로 참이 되지 않거나, 크기를 비교하는 곳에서 멈출 거예요." },
  { label = "의심 지점", text = "{line}번 줄에서 `{name}`을 숫자와 비교하고 있어요. `{name}`에는 숫자가 들어 있을까요, 글자가 들어 있을까요?" },
  { label = "힌트", text = "`input()`으로 받은 값은 언제나 글자예요. 글자 \"3\"과 숫자 3은 파이썬에게 서로 다른 값이에요. 둘을 같은 종류로 맞추려면 어떻게 해야 할까요?" },
]

[[case]]
id = "cond.or_constant"
category = "조건문"
label = "x == 1 or 2 처럼 or 조건을 잘못 쓰기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "`{name}`에 어떤 값을 넣어도 이 조건은 언제나 참이 될 거예요." },
  { label = "의심 지점", text = "{line}번 줄 조건의 `or` 뒤쪽에 있는 `{expr}`만 따로 떼어 읽어 보세요." },
  { label = "힌트", text = "`or` 양쪽은 각각 따로 참·거짓을 판단해요. `{expr}` 혼자는 무엇과 비교하고 있나요? 비교하지 않은 값 혼자는 참일까요, 거짓일까요?" },
]

[[case]]
id = "cond.wide_condition_first"
category = "조건문"
label = "넓은 조건을 먼저 검사해서 뒤의 조건이 실행되지 않게 하기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "어떤 값을 넣어도 실행되지 않는 조건이 있어요." },
  { label = "의심 지점", text = "{line}번 줄의 조건이 참이 되는 `{name}` 값을 하나 떠올려 보세요. 그 값이면 {other_line}번 줄의 조건은 이미 참이지 않나요?" },
  { label = "힌트", text = "`if`와 `elif`는 위에서부터 차례로 검사해서 처음 참이 된 곳 하나만 실행해요. 더 넓은 범위와 더 좁은 범위 중 어느 쪽을 먼저 물어봐야 할까요?" },
]

# ---------- 반복문 ----------

[[case]]
id = "loop.while_true_no_break"
category = "반복문"
label = "while True 에서 break 를 빠뜨리기"
method = "ast"
priority = 30
steps = [
  { label = "관찰", text = "이 반복문은 끝나지 않을 거예요. 반복을 멈추게 하는 문장이 하나도 없어요." },
  { label = "의심 지점", text = "{line}번 줄의 `while` 본문을 보세요. 어떤 일이 생기면 반복을 그만두어야 하나요?" },
  { label = "힌트", text = "조건이 언제나 참인 `while`은 스스로는 멈추지 않아요. 원하는 일이 생겼을 때 반복을 빠져나가는 키워드를 떠올려 보세요." },
]

[[case]]
id = "loop.while_no_update"
category = "반복문"
label = "while 문에서 조건을 바꾸는 문장을 빠뜨려 무한 반복하기"
method = "ast"
priority = 30
steps = [
  { label = "관찰", text = "조건이 처음에 참이면 이 반복문은 끝나지 않을 거예요." },
  { label = "의심 지점", text = "{line}번 줄의 `while` 조건에 쓴 `{name}`은 반복할 때마다 어떻게 바뀌나요? 본문에서 찾아보세요." },
  { label = "힌트", text = "조건이 언젠가 거짓이 되려면 반복문 안에서 무엇인가 바뀌어야 해요. 한 번 돌 때마다 `{name}`이 어떻게 바뀌어야 할지 생각해 보세요." },
]

[[case]]
id = "loop.count_set_to_one"
category = "반복문"
label = "개수를 셀 때 count += 1 대신 count = 1 이라고 쓰기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "조건에 맞는 것이 여러 개여도 `{name}`은 1보다 커지지 않을 거예요." },
  { label = "의심 지점", text = "{line}번 줄을 보세요. 이 줄이 두 번, 세 번 실행되면 `{name}`은 얼마가 되나요?" },
  { label = "힌트", text = "개수를 세려면 '1로 만든다'가 아니라 '지금 값에서 하나 늘린다'여야 해요. 지금 값을 바탕으로 새 값을 만드는 식을 떠올려 보세요." },
]

[[case]]
id = "loop.value_as_index"
category = "반복문"
label = "for i in 리스트 에서 i 가 값인데 인덱스처럼 쓰기 (a[i])"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "이 코드를 실행하면 엉뚱한 칸의 값을 꺼내거나, 리스트 범위를 벗어났다며 멈출 수 있어요." },
  { label = "의심 지점", text = "{other_line}번 줄의 `for {name} in {name2}`에서 `{name}`에는 무엇이 들어 있나요? {line}번 줄에서는 그것을 `{name2}[{name}]`처럼 칸 번호로 쓰고 있어요." },
  { label = "힌트", text = "`for` 뒤의 변수에는 리스트의 칸 번호가 아니라 칸에 든 값이 하나씩 들어와요. 값을 그대로 쓰면 될까요, 아니면 칸 번호가 정말 필요한가요?" },
]

[[case]]
id = "loop.modify_while_iterating"
category = "반복문"
label = "반복문으로 리스트를 순회하면서 그 리스트의 항목을 지우기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "반복하는 동안 리스트가 바뀌어서, 어떤 항목은 건너뛰거나 반복이 끝나지 않을 수 있어요." },
  { label = "의심 지점", text = "{other_line}번 줄에서 `{name}`을 하나씩 돌고 있는데, {line}번 줄에서 바로 그 `{name}`을 바꾸고 있어요." },
  { label = "힌트", text = "`for`는 리스트의 몇 번째 칸까지 왔는지 기억하며 돌아요. 도는 중에 칸이 지워지거나 늘어나면 어떻게 될까요? 결과를 담을 리스트를 따로 두는 방법을 생각해 보세요." },
]

[[case]]
id = "loop.return_in_loop"
category = "반복문"
label = "반복문 안에서 return 을 써서 첫 번째 반복에서 함수가 끝나기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "이 반복문은 첫 번째 값만 보고 함수가 끝나 버릴 거예요. 나머지 값은 검사하지 않아요." },
  { label = "의심 지점", text = "{other_line}번 줄의 반복문에서 {line}번 줄까지 왔을 때, 어떤 길로 가도 `return`을 만나지 않나요?" },
  { label = "힌트", text = "`return`을 만나면 반복문뿐 아니라 함수 전체가 바로 끝나요. 모든 값을 다 본 뒤에야 알 수 있는 대답은 반복문의 안과 밖 중 어디에서 돌려줘야 할까요?" },
]

# ---------- 중첩 반복문 ----------

[[case]]
id = "nested.same_loop_var"
category = "중첩 반복문"
label = "안쪽과 바깥쪽 반복문에 같은 변수 이름(i)을 쓰기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "안쪽 반복이 바깥쪽 반복의 변수를 덮어써서, 바깥쪽 값이 생각과 다르게 바뀔 거예요." },
  { label = "의심 지점", text = "{other_line}번 줄의 바깥쪽 `for`와 {line}번 줄의 안쪽 `for`가 둘 다 `{name}`을 쓰고 있어요." },
  { label = "힌트", text = "안쪽 반복이 돌 때 `{name}`에는 안쪽 값이 들어가요. 바깥쪽에서 몇 번째인지와 안쪽에서 몇 번째인지를 따로 기억하려면 어떻게 해야 할까요?" },
]

[[case]]
id = "nested.shared_rows"
category = "중첩 반복문"
label = "2차원 리스트를 [[0] * n] * m 으로 만들어 모든 행이 함께 바뀌기"
method = "ast"
priority = 40
steps = [
  { label = "관찰", text = "한 칸만 바꿨는데 모든 줄(행)의 같은 칸이 함께 바뀔 거예요." },
  { label = "의심 지점", text = "{line}번 줄에서 리스트를 `*`로 늘려 여러 줄을 만들었어요. 이렇게 만든 줄들은 서로 다른 리스트일까요?" },
  { label = "힌트", text = "리스트를 `*`로 늘리면 같은 리스트를 가리키는 것이 여러 개 생길 뿐 새 리스트가 만들어지지 않아요. 줄마다 새 리스트를 하나씩 만들려면 무엇을 써야 할까요?" },
]

# ---------- 함수 ----------

[[case]]
id = "func.wrong_arg_count"
category = "함수"
label = "필요한 인자를 전달하지 않기"
method = "ast"
priority = 20
steps = [
  { label = "관찰", text = "이 코드를 실행하면 `{name}` 함수를 부르는 곳에서 멈출 거예요. 넘겨준 값의 개수가 맞지 않아요." },
  { label = "의심 지점", text = "{line}번 줄에서 `{name}`에 값을 {count} 넘겼어요. {other_line}번 줄의 정의에서는 몇 개를 받기로 했나요?" },
